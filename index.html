<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6a51">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동영상 줄이기">
<title>동영상 줄이기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one big button at home; a single column with the video, its size and one action at a time. */
:root {
  --bg: #edf1ee;
  --surface: #ffffff;
  --fg: #16201b;
  --muted: #4b5952;
  --line: #c9d3cd;
  --accent: #1d6a51;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe4;
  --warn-bg: #fbeee6;
  --warn-fg: #8a3510;
  --paper: #ffffff;
  --shadow: 0 1px 2px rgb(22 32 27 / .10), 0 6px 18px rgb(22 32 27 / .08);
  --display: "Gowun Batang", "Noto Serif KR", serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111714; --surface: #1a221e; --fg: #e8eeea; --muted: #a9b7af; --line: #33403a;
    --accent: #63c49d; --accent-ink: #0b1712; --accent-soft: #1f3a2f;
    --warn-bg: #3a2216; --warn-fg: #ffc4a3;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111714; --surface: #1a221e; --fg: #e8eeea; --muted: #a9b7af; --line: #33403a;
  --accent: #63c49d; --accent-ink: #0b1712; --accent-soft: #1f3a2f;
  --warn-bg: #3a2216; --warn-fg: #ffc4a3;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 20px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
button, label.btn { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }

.home {
  box-sizing: border-box; max-width: 640px; margin: 0 auto;
  min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  display: flex; flex-direction: column; justify-content: center; text-align: center;
}
.pick {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  min-height: 112px; padding: 20px;
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 22px; cursor: pointer;
  font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em;
  box-shadow: var(--shadow);
  transition: transform .12s ease, filter .12s ease;
}
.pick:hover { filter: brightness(1.06); }
.pick:active { transform: scale(.985); }
.pick svg { width: 44px; height: 44px; flex: none; }
.pick { min-height: 140px; font-size: 2rem; }
body.dragging .pick { outline: 4px dashed var(--accent); outline-offset: 6px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
}
.bar .name {
  flex: 1 1 160px; min-width: 0; font-weight: 700; font-size: 1.05rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 56px; min-width: 56px; padding: 0 16px;
  background: var(--bg); color: var(--fg); border: 2px solid var(--line);
  border-radius: 14px; cursor: pointer; font-size: 1.05rem; font-weight: 500;
}
.tbtn:hover { border-color: var(--accent); }
.tbtn:disabled { opacity: .4; cursor: default; }
.tbtn svg { width: 24px; height: 24px; }
.tbtn.back { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 1rem; padding: 10px; min-height: 48px; cursor: pointer; }
.vbox {
  max-width: 560px; margin: 0 auto; box-sizing: border-box;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; text-align: center;
}
.vbox p { margin: 0; }
.vprev { width: 100%; max-height: 46vh; background: #000; border-radius: 16px; }
.vname { color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
.vbig { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.vsub { color: var(--muted); }
.vprog { height: 22px; border-radius: 11px; background: var(--accent-soft); overflow: hidden; }
.vprog > div { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.vwide { width: 100%; min-height: 72px; font-size: 1.2rem; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.res button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 76px; padding: 8px; cursor: pointer; font: inherit;
  background: var(--surface); color: var(--fg); border: 2px solid var(--line); border-radius: 16px;
}
.res button b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.res button span { font-size: .9rem; color: var(--muted); }
.res button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.res button[aria-checked="true"] span { color: var(--accent-ink); opacity: .9; }
.split { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 56px; cursor: pointer; font-size: 1.05rem; }
.split input { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }
.split small { color: var(--muted); font-size: .85rem; }
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; text-align: left; }
.parts li {
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
}
.parts li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.parts li { grid-template-columns: 1fr auto auto; }
.parts li span:nth-child(2) { color: var(--muted); font-variant-numeric: tabular-nums; }
.part-save {
  min-height: 48px; min-width: 76px; padding: 0 14px; cursor: pointer; font: inherit; font-weight: 700;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
}
.part-save.done { background: var(--accent-soft); color: var(--fg); font-weight: 500; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; background: var(--accent-soft); border-radius: 16px; }
.tabs button {
  min-height: 56px; border: 0; border-radius: 12px; cursor: pointer; font: inherit; font-weight: 500;
  background: transparent; color: var(--fg);
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--accent); font-weight: 700; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.res3 { grid-template-columns: 1fr 1fr 1fr; }
#vscreen .pick { min-height: 96px; }

@media (prefers-reduced-motion: reduce) {
  .pick, .vprog > div { transition: none; }
}
@media (max-width: 420px) {
  body { font-size: 19px; }
}
</style>
</head>
<body>
<input type="file" id="videoFile" hidden accept="video/*,.mp4,.mov,.m4v,.3gp,.webm,.mkv">

<main id="home" class="home">
  <label for="videoFile" class="pick" id="videoBtn" tabindex="0" role="button">동영상 줄이기</label>
</main>

<section id="vscreen" hidden>
  <div class="bar">
    <button type="button" class="tbtn back" id="vBack" aria-label="처음 화면으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span class="lbl">뒤로</span>
    </button>
  </div>
  <div class="vbox">
    <video id="vPreview" class="vprev" controls playsinline preload="metadata"></video>
    <p class="vname" id="vName"></p>
    <p class="vbig" id="vSize"></p>
    <p class="vsub" id="vSub"></p>
    <ul class="parts" id="vParts" hidden></ul>
    <div class="vprog" id="vProg" hidden><div id="vBar"></div></div>
    <div class="tabs" id="vTabs" role="tablist" aria-label="할 일 고르기">
      <button type="button" role="tab" data-mode="shrink">용량 줄이기</button>
      <button type="button" role="tab" data-mode="seotda">섯다 분석용 사진</button>
    </div>
    <div class="res res3" id="vInt" role="radiogroup" aria-label="캡처 간격" hidden>
      <button type="button" role="radio" data-sec="1"><b>1초</b><span>추천</span></button>
      <button type="button" role="radio" data-sec="2"><b>2초</b><span>보통</span></button>
      <button type="button" role="radio" data-sec="3"><b>3초</b><span>적게</span></button>
    </div>
    <button type="button" class="pick" id="vSnap" hidden>사진 만들기</button>
    <div class="res" id="vRes" role="radiogroup" aria-label="화질 고르기">
      <button type="button" role="radio" data-long="640"><b>360p</b><span>가장 작게</span></button>
      <button type="button" role="radio" data-long="854"><b>480p</b><span>카톡용 추천</span></button>
      <button type="button" role="radio" data-long="1280"><b>720p</b><span>선명하게</span></button>
      <button type="button" role="radio" data-long="1920"><b>1080p</b><span>원본에 가깝게</span></button>
    </div>
    <label class="split" id="vSplitRow"><input type="checkbox" id="vSplit"><span>30MB가 넘으면 나누기 <small>(Claude 업로드용)</small></span></label>
    <button type="button" class="pick" id="vGo">줄이기</button>
    <button type="button" class="pick" id="vZip" hidden>ZIP으로 한 번에 받기</button>
    <button type="button" class="pick" id="vSave" hidden>저장하기</button>
    <button type="button" class="tbtn vwide" id="vShare" hidden>카카오톡 등으로 보내기</button>
    <button type="button" class="link-btn" id="vCancel" hidden>그만하기</button>
  </div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const home = $('home');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function canShareFiles(files) {
    try { return !!(navigator.canShare && navigator.canShare({ files })); } catch { return false; }
  }
  async function downloadAll(files) {
    for (const f of files) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      await new Promise((r) => setTimeout(r, 400));
    }
  }

  /* ---------- 동영상 줄이기 (WebCodecs, 기기 안에서 처리) ---------- */
  const MB_URL = 'https://cdn.jsdelivr.net/npm/mediabunny@1.61.1/dist/bundles/mediabunny.min.mjs';
  const vs = $('vscreen');
  let vFile = null, vResults = null, partFiles = [], vConv = null, vStop = false, vUrl = null, wakeLock = null;
  function isVideo(f) {
    return (f.type && f.type.startsWith('video/')) || /\.(mp4|mov|m4v|3gp|webm|mkv)$/i.test(f.name);
  }
  function fmtSize(n) {
    if (n >= 1024 * 1024 * 1024) return (n / 1024 / 1024 / 1024).toFixed(1) + 'GB';
    if (n >= 1024 * 1024) return Math.round(n / 1024 / 1024) + 'MB';
    return Math.max(1, Math.round(n / 1024)) + 'KB';
  }
  function setPreview(blob) {
    if (vUrl) URL.revokeObjectURL(vUrl);
    vUrl = URL.createObjectURL(blob);
    $('vPreview').src = vUrl;
  }
  function vState(st) {
    const ready = st === 'ready';
    $('vTabs').hidden = !ready;
    $('vGo').hidden = $('vRes').hidden = $('vSplitRow').hidden = !(ready && vMode === 'shrink');
    $('vSnap').hidden = $('vInt').hidden = !(ready && vMode === 'seotda');
    $('vParts').hidden = $('vParts').children.length === 0;
    $('vProg').hidden = st !== 'busy';
    $('vCancel').hidden = st !== 'busy';
    $('vSave').hidden = $('vShare').hidden = st !== 'done';
    $('vZip').hidden = !(st === 'done' && vResults && vResults.length > 1 && vResults[0].type === 'image/jpeg');
    $('vSave').className = $('vZip').hidden ? 'pick' : 'tbtn vwide';
    if (st === 'done') $('vShare').hidden = !navigator.share;
  }
  async function keepAwake(on) {
    try {
      if (on && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch {}
  }
  function openVideo(file) {
    vFile = file; vResults = null; partFiles = []; $('vParts').innerHTML = ''; $('vParts').hidden = true;
    home.hidden = true; vs.hidden = false;
    window.scrollTo(0, 0);
    setPreview(file);
    $('vName').textContent = file.name;
    $('vSize').textContent = '지금 크기 ' + fmtSize(file.size);
    paintTabs();
    resetRes();
    $('vBar').style.width = '0';
    vState('ready');
    $('vSave').textContent = '저장하기';
  }
  async function closeVideo() {
    if (vConv) { try { await vConv.cancel(); } catch {} vConv = null; }
    keepAwake(false);
    $('vPreview').removeAttribute('src'); $('vPreview').load();
    if (vUrl) { URL.revokeObjectURL(vUrl); vUrl = null; }
    vFile = vResults = null; vStop = true;
    vs.hidden = true; home.hidden = false;
    $('videoFile').value = '';
  }
  $('vBack').onclick = closeVideo;
  $('videoFile').addEventListener('change', () => { const f = $('videoFile').files[0]; if (f) openVideo(f); });

  $('videoBtn').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('videoFile').click(); } });

  /* 해상도 고르기 (긴 쪽 픽셀 기준), 마지막 선택을 기억 */
  const resBtns = [...document.querySelectorAll('#vRes button')];
  let resLong = 854;
  try { const v = parseInt(localStorage.getItem('resLong'), 10); if (resBtns.some((b) => +b.dataset.long === v)) resLong = v; } catch {}
  function paintRes() { resBtns.forEach((b) => b.setAttribute('aria-checked', String(+b.dataset.long === resLong))); }
  function pickRes(v) { resLong = v; paintRes(); try { localStorage.setItem('resLong', String(v)); } catch {} }
  resBtns.forEach((b) => { b.onclick = () => pickRes(+b.dataset.long); });
  function resetRes() { resBtns.forEach((b) => { b.hidden = false; }); paintRes(); }
  // 원본보다 큰 해상도는 숨기기
  $('vPreview').addEventListener('loadedmetadata', () => {
    if (!vFile || vResults) return;
    const orig = Math.max($('vPreview').videoWidth, $('vPreview').videoHeight);
    if (!orig) return;
    let visible = resBtns.filter((b) => +b.dataset.long <= orig * 1.05);
    if (!visible.length) visible = [resBtns[0]];
    resBtns.forEach((b) => { b.hidden = !visible.includes(b); });
    if (!visible.some((b) => +b.dataset.long === resLong)) { resLong = +visible[visible.length - 1].dataset.long; paintRes(); }
  });
  paintRes();
  /* 할 일 고르기: 용량 줄이기 / 섯다 분석용 사진 (마지막 선택 기억) */
  let vMode = 'shrink';
  try { if (localStorage.getItem('mode') === 'seotda') vMode = 'seotda'; } catch {}
  const tabBtns = [...document.querySelectorAll('#vTabs button')];
  function paintTabs() {
    tabBtns.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === vMode)));
    $('vSub').textContent = vMode === 'seotda'
      ? '고른 간격마다 화면을 찍고, 변화 없는 장면은 건너뛰어요. 8장씩 묶어 사진으로 만들어요.'
      : '화질을 고르고 "줄이기"를 누르세요.';
  }
  tabBtns.forEach((b) => { b.onclick = () => {
    vMode = b.dataset.mode; try { localStorage.setItem('mode', vMode); } catch {}
    paintTabs(); vState('ready');
  }; });

  const intBtns = [...document.querySelectorAll('#vInt button')];
  let snapSec = 1;
  try { const v = parseInt(localStorage.getItem('snapSec'), 10); if ([1, 2, 3].includes(v)) snapSec = v; } catch {}
  function paintInt() { intBtns.forEach((b) => b.setAttribute('aria-checked', String(+b.dataset.sec === snapSec))); }
  intBtns.forEach((b) => { b.onclick = () => { snapSec = +b.dataset.sec; try { localStorage.setItem('snapSec', String(snapSec)); } catch {} paintInt(); }; });
  paintInt();

  /* 섯다 분석용 사진: 일정 간격으로 찍고, 직전에 남긴 장면과 거의 같으면 건너뛰고, 8장씩 한 장으로 묶기 */
  const SHEET_LONG = 1600, HEADER = 44, PER_SHEET = 8;
  const DIFF_W = 480, DIFF_H = 270, PIX_DIFF = 28, MIN_CHANGED = 6;
  function hms(t) {
    t = Math.max(0, Math.floor(t));
    const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    return [h, m, s].map((x) => String(x).padStart(2, '0')).join(':');
  }
  async function makeSheets() {
    if (!vFile) return;
    const t0 = performance.now();
    vStop = false; partFiles = []; $('vParts').innerHTML = '';
    $('vPreview').pause();
    vState('busy');
    $('vSize').textContent = '0%';
    $('vSub').textContent = '사진을 만드는 중이에요. 화면을 끄지 말고 기다려 주세요.';
    keepAwake(true);
    try {
      const mb = await import(MB_URL);
      const input = new mb.Input({ source: new mb.BlobSource(vFile), formats: mb.ALL_FORMATS });
      const vt = await input.getPrimaryVideoTrack();
      if (!vt) throw Object.assign(new Error('no video'), { user: '동영상 파일이 아닌 것 같아요. 다른 파일을 골라 주세요.' });
      if (!(await vt.canDecode())) throw Object.assign(new Error('no decoder'), { user: '이 휴대폰(브라우저)에서는 이 동영상을 읽을 수 없어요. 크롬 최신 버전에서 다시 해 보세요.' });
      const duration = await input.computeDuration();

      // 가로 화면은 2칸×4줄, 세로 화면은 4칸×2줄 → 묶은 사진이 정사각형에 가깝게
      const W = vt.displayWidth, H = vt.displayHeight;
      const cols = W >= H ? 2 : 4, rows = PER_SHEET / cols;
      const k = Math.min(SHEET_LONG / (cols * W), (SHEET_LONG - HEADER) / (rows * H));
      const cw = Math.round(W * k), ch = Math.round(H * k);
      const sink = new mb.CanvasSink(vt, { width: cw, height: ch, fit: 'contain', poolSize: 2 });

      const base = vFile.name.replace(/\.[^.]+$/, '') || '동영상';
      const diff = document.createElement('canvas'); diff.width = DIFF_W; diff.height = DIFF_H;
      const dctx = diff.getContext('2d', { willReadFrequently: true });
      let lastGray = null;
      const gray = new Uint8Array(DIFF_W * DIFF_H);

      let sheet = null, sctx = null, slot = 0, sheetNo = 0, firstT = 0, lastT = 0;
      let kept = 0, seen = 0;
      const newSheet = () => {
        sheet = document.createElement('canvas');
        sheet.width = cols * cw; sheet.height = HEADER + rows * ch;
        sctx = sheet.getContext('2d');
        sctx.fillStyle = '#111'; sctx.fillRect(0, 0, sheet.width, sheet.height);
        slot = 0;
      };
      const flush = async () => {
        if (!sheet || slot === 0) return;
        sheetNo++;
        const usedRows = Math.ceil(slot / cols);
        const out = document.createElement('canvas');
        out.width = sheet.width; out.height = HEADER + usedRows * ch;
        const o = out.getContext('2d');
        o.drawImage(sheet, 0, 0);
        o.fillStyle = '#000'; o.fillRect(0, 0, out.width, HEADER);
        o.fillStyle = '#fff'; o.font = 'bold 22px "Noto Sans KR", sans-serif'; o.textBaseline = 'middle';
        o.fillText(`${base} · ${sheetNo}번 사진 · ${hms(firstT)} ~ ${hms(lastT)} · ${snapSec}초 간격`, 12, HEADER / 2);
        const blob = await new Promise((r) => out.toBlob(r, 'image/jpeg', 0.85));
        const name = `${base}_섯다_${String(sheetNo).padStart(2, '0')}.jpg`;
        addPart(new File([blob], name, { type: 'image/jpeg' }), `${sheetNo}번 · ${hms(firstT).slice(3)}~${hms(lastT).slice(3)}`);
        sheet = null;
      };

      const times = [];
      for (let t = 0; t < duration - 0.05; t += snapSec) times.push(t);
      for await (const wc of sink.canvasesAtTimestamps(times)) {
        const t = times[seen++];
        if (vStop) return;
        if (wc) {
          // 변화 확인: 작게 줄여 흑백으로 비교, 크게 바뀐 점이 몇 개 이상이면 남기기
          dctx.drawImage(wc.canvas, 0, 0, DIFF_W, DIFF_H);
          const px = dctx.getImageData(0, 0, DIFF_W, DIFF_H).data;
          let changed = 0;
          for (let i = 0, j = 0; j < gray.length; i += 4, j++) {
            const g = (px[i] * 77 + px[i + 1] * 150 + px[i + 2] * 29) >> 8;
            if (lastGray && Math.abs(g - lastGray[j]) > PIX_DIFF) changed++;
            gray[j] = g;
          }
          if (!lastGray || changed >= MIN_CHANGED) {
            lastGray = lastGray || new Uint8Array(gray.length);
            lastGray.set(gray);
            if (!sheet) { newSheet(); firstT = t; }
            const x = (slot % cols) * cw, y = HEADER + Math.floor(slot / cols) * ch;
            sctx.drawImage(wc.canvas, x, y, cw, ch);
            // 시각 표시 (노란 글씨, 검은 상자)
            const label = hms(t);
            sctx.font = 'bold 22px ui-monospace, Menlo, Consolas, monospace';
            const tw = sctx.measureText(label).width;
            sctx.fillStyle = '#000'; sctx.fillRect(x + 4, y + 4, tw + 12, 30);
            sctx.fillStyle = '#ffd400'; sctx.textBaseline = 'middle'; sctx.fillText(label, x + 10, y + 19);
            // 칸 구분선
            sctx.strokeStyle = '#444'; sctx.lineWidth = 2; sctx.strokeRect(x + 1, y + 1, cw - 2, ch - 2);
            lastT = t; slot++; kept++;
            if (slot === PER_SHEET) await flush();
          }
        }
        const frac = seen / times.length;
        $('vSize').textContent = Math.min(99, Math.floor(frac * 100)) + '%';
        $('vBar').style.width = Math.min(99, Math.floor(frac * 100)) + '%';
        const spent = (performance.now() - t0) / 1000;
        if (frac > 0.05 && spent > 3) $('vSub').textContent = `약 ${fmtTime(spent * (1 - frac) / frac)} 남았어요. 지금까지 사진 ${sheetNo}장`;
      }
      await flush();
      if (vStop) return;

      const took = fmtTime((performance.now() - t0) / 1000);
      vResults = partFiles.slice();
      const skipped = times.length - kept;
      $('vSize').textContent = `사진 ${vResults.length}장 (장면 ${kept}개)`;
      $('vSub').textContent = `${hms(duration)} 영상에서 변화 없는 장면 ${skipped}개를 건너뛰었어요. 걸린 시간 ${took}`
        + (vResults.length > 20 ? ` · Claude에는 한 번에 20장까지 올릴 수 있어요. 1~20번을 먼저 올리고 나머지는 다음 메시지로 올려 주세요.` : '');
      $('vSave').textContent = vResults.length > 1 ? '모두 저장하기' : '저장하기';
      $('vBar').style.width = '100%';
      vState('done');
    } catch (e) {
      if (vStop) return;
      console.error(e);
      $('vSize').textContent = '사진을 만들지 못했어요';
      $('vSub').textContent = (e && e.user) || '지원하지 않는 동영상 형식일 수 있어요. 다시 눌러 보세요.';
      vState('ready');
    } finally { keepAwake(false); }
  }
  $('vSnap').onclick = makeSheets;

  const LIMIT = 30 * 1024 * 1024;
  let splitOn = true;
  try { if (localStorage.getItem('split') === '0') splitOn = false; } catch {}
  $('vSplit').checked = splitOn;
  $('vSplit').onchange = () => { splitOn = $('vSplit').checked; try { localStorage.setItem('split', splitOn ? '1' : '0'); } catch {} };

  function planSize(w, h, long) {
    const k = Math.min(1, long / Math.max(w, h));
    const ow = Math.max(2, Math.round(w * k / 2) * 2), oh = Math.max(2, Math.round(h * k / 2) * 2);
    const bitrate = Math.round(Math.min(5_000_000, Math.max(400_000, ow * oh * 30 * 0.07)));
    return { k, ow, oh, bitrate };
  }
  function fmtTime(sec) {
    sec = Math.max(1, Math.round(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m ? `${m}분 ${s}초` : `${s}초`;
  }
  async function compress(long) {
    if (!vFile) return;
    const mode = { long, latency: long <= 854 ? 'realtime' : 'quality' };
    const t0 = performance.now();
    const limit = splitOn ? LIMIT : Infinity;
    vStop = false; partFiles = []; $('vParts').innerHTML = '';
    $('vPreview').pause();
    vState('busy');
    $('vSize').textContent = '0%';
    $('vSub').textContent = '줄이는 중이에요. 화면을 끄지 말고 기다려 주세요.';
    keepAwake(true);
    try {
      const mb = await import(MB_URL);
      const probe = new mb.Input({ source: new mb.BlobSource(vFile), formats: mb.ALL_FORMATS });
      const vt = await probe.getPrimaryVideoTrack();
      if (!vt) throw Object.assign(new Error('no video'), { user: '동영상 파일이 아닌 것 같아요. 다른 파일을 골라 주세요.' });
      const plan = planSize(vt.displayWidth, vt.displayHeight, mode.long);
      const duration = await probe.computeDuration().catch(() => 0);

      // 미리 판단: 이미 작고 가벼우면서 나눌 필요도 없으면 바로 끝내기
      if (duration > 0 && plan.k >= 1 && vFile.size <= limit) {
        const fileBps = vFile.size * 8 / duration;
        if (fileBps <= plan.bitrate * 1.3 + 300_000) {
          vResults = [new File([vFile], vFile.name, { type: vFile.type || 'video/mp4' })];
          $('vSize').textContent = fmtSize(vFile.size);
          $('vSub').textContent = '이미 충분히 작은 동영상이에요. 그대로 보내셔도 돼요.';
          $('vBar').style.width = '100%';
          vState('done');
          return;
        }
      }

      // 인코더 고르기: H.264(카톡·아이폰 호환) 우선, 하드웨어 우선
      const encOpts = { width: plan.ow, height: plan.oh, bitrate: plan.bitrate, frameRate: 30 };
      let codec = null, hw = false;
      for (const c of ['avc', 'vp9']) {
        if (await mb.canEncodeVideo(c, { ...encOpts, hardwareAcceleration: 'prefer-hardware' })) { codec = c; hw = true; break; }
        if (await mb.canEncodeVideo(c, encOpts)) { codec = c; break; }
      }
      if (!codec) throw Object.assign(new Error('no encoder'), { user: '이 휴대폰(브라우저)에서는 동영상을 줄일 수 없어요. 크롬 최신 버전에서 다시 해 보세요.' });

      // 나눌 길이 정하기: 예상 용량(영상 목표 + 소리)으로 계산하고 여유를 둠
      let aBps = 0;
      const at = await probe.getPrimaryAudioTrack();
      if (at) { try { aBps = (await at.computePacketStats(300)).averageBitrate || 160_000; } catch { aBps = 160_000; } }
      const estBps = plan.bitrate + aBps;
      let segLen = Infinity;
      if (limit !== Infinity && duration > 0 && estBps * duration / 8 > limit * 0.85) {
        const n = Math.ceil(estBps * duration / 8 / (limit * 0.85));
        segLen = Math.max(10, duration / n);   // 같은 길이로 고르게 나누기
      }

      async function runPart(start, end, onP) {
        const input = new mb.Input({ source: new mb.BlobSource(vFile), formats: mb.ALL_FORMATS });
        const output = new mb.Output({ format: new mb.Mp4OutputFormat({ fastStart: 'in-memory' }), target: new mb.BufferTarget() });
        const conv = await mb.Conversion.init({
          input, output, tracks: 'primary',
          ...(end !== undefined ? { trim: { start, end } } : {}),
          video: () => {
            const opts = { codec, frameRate: 30, forceTranscode: true, keyFrameInterval: 4, bitrate: plan.bitrate, latencyMode: mode.latency };
            if (hw) opts.hardwareAcceleration = 'prefer-hardware';
            if (plan.k < 1) { opts.width = plan.ow; opts.height = plan.oh; opts.fit = 'contain'; }
            return opts;
          },
          // 소리는 다시 압축하지 않고 그대로 복사 (필요할 때만 자동 변환)
        });
        if (!conv.utilizedTracks.some((t) => t.type === 'video')) {
          throw Object.assign(new Error('video track dropped'), { user: '이 휴대폰(브라우저)에서는 이 동영상 형식을 줄일 수 없어요. 크롬 최신 버전에서 다시 해 보세요.' });
        }
        if (!conv.isValid) throw Object.assign(new Error('invalid'), { user: '이 동영상은 줄일 수 없는 형식이에요.' });
        vConv = conv;
        conv.onProgress = onP;
        await conv.execute();
        vConv = null;
        return { blob: new Blob([output.target.buffer], { type: 'video/mp4' }), lostAudio: conv.discardedTracks.some((d) => d.track.type === 'audio') };
      }

      const showProgress = (frac) => {
        const pct = Math.min(99, Math.floor(frac * 100));
        $('vSize').textContent = pct + '%';
        $('vBar').style.width = pct + '%';
        const spent = (performance.now() - t0) / 1000;
        if (frac > 0.05 && spent > 3) $('vSub').textContent = `약 ${fmtTime(spent * (1 - frac) / frac)} 남았어요. 화면을 끄지 말아 주세요.`;
      };

      const base = vFile.name.replace(/\.[^.]+$/, '') || '동영상';
      const blobs = [];
      let lostAudio = false, start = 0;
      while (true) {
        if (vStop) return;
        const end = segLen === Infinity ? undefined : Math.min(duration, start + segLen);
        const span = (end === undefined ? duration : end) - start;
        const r = await runPart(start, end, (p) => { if (duration > 0) showProgress((start + p * span) / duration); else showProgress(p); });
        if (vStop) return;
        // 예상보다 커서 한도를 넘으면 그 부분만 더 짧게 다시
        if (r.blob.size > limit && span > 5) {
          if (segLen === Infinity) segLen = duration;
          segLen = Math.max(5, span * (limit / r.blob.size) * 0.9);
          continue;
        }
        blobs.push(r.blob);
        lostAudio = lostAudio || r.lostAudio;
        if (segLen !== Infinity) addPart(new File([r.blob], `${base}_줄임_${blobs.length}.mp4`, { type: 'video/mp4' }));
        if (end === undefined || end >= duration - 0.05) break;
        start = end;
        if (blobs.length > 60) throw Object.assign(new Error('too many parts'), { user: '동영상이 너무 길어요. 더 낮은 화질을 골라 주세요.' });
      }

      const took = fmtTime((performance.now() - t0) / 1000);
      const total = blobs.reduce((n, x) => n + x.size, 0);
      const audioNote = lostAudio ? ' · 이 휴대폰에서는 소리를 함께 넣지 못했어요.' : '';
      if (blobs.length === 1 && total >= vFile.size * 0.95 && vFile.size <= limit) {
        vResults = [new File([vFile], vFile.name, { type: vFile.type || 'video/mp4' })];
        $('vSize').textContent = fmtSize(vFile.size);
        $('vSub').textContent = '이미 충분히 작은 동영상이에요. 원래 동영상을 그대로 쓰셔도 돼요.';
      } else if (blobs.length === 1) {
        vResults = [new File([blobs[0]], base + '_줄임.mp4', { type: 'video/mp4' })];
        const saved = Math.round((1 - total / vFile.size) * 100);
        $('vSize').textContent = `${fmtSize(vFile.size)} → ${fmtSize(total)}`;
        $('vSub').textContent = `${saved}% 줄었어요. 걸린 시간 ${took}` + audioNote;
        setPreview(vResults[0]);
      } else {
        vResults = partFiles.slice();
        $('vSize').textContent = `${fmtSize(vFile.size)} → ${blobs.length}개로 나눔`;
        $('vSave').textContent = '모두 저장하기';
        $('vSub').textContent = `모두 합쳐 ${fmtSize(total)}, 하나당 30MB 이하예요. 걸린 시간 ${took}` + audioNote;
        setPreview(vResults[0]);
      }
      $('vBar').style.width = '100%';
      vState('done');
    } catch (e) {
      vConv = null;
      if (vStop || (e && e.name === 'ConversionCanceledError')) return;
      console.error(e);
      $('vSize').textContent = '줄이지 못했어요';
      $('vSub').textContent = (e && e.user) || '동영상이 너무 길거나 지원하지 않는 형식일 수 있어요. 다시 눌러 보세요.';
      vState('ready');
    } finally { keepAwake(false); }
  }
  $('vGo').onclick = () => compress(resLong);
  $('vCancel').onclick = async () => {
    vStop = true;
    if (vConv) { try { await vConv.cancel(); } catch {} vConv = null; }
    $('vSize').textContent = '지금 크기 ' + fmtSize(vFile.size);
    $('vSub').textContent = partFiles.length ? `멈췄어요. 끝난 ${partFiles.length}개는 아래에서 저장할 수 있어요.` : '멈췄어요.';
    $('vBar').style.width = '0';
    vState('ready');
  };
  function addPart(file, label) {
    partFiles.push(file);
    const i = partFiles.length - 1;
    const li = document.createElement('li');
    li.innerHTML = `<span></span><span></span><button type="button" class="part-save" data-i="${i}">저장</button>`;
    li.children[0].textContent = label || `${i + 1}번 조각`;
    li.children[1].textContent = fmtSize(file.size);
    $('vParts').appendChild(li);
    $('vParts').hidden = false;
  }
  async function saveFiles(files, quiet) {
    try {
      if (isIOS && canShareFiles(files)) {
        if (!quiet) $('vSub').textContent = '다음 화면에서 "비디오 저장"을 눌러 주세요.';
        await navigator.share({ files });
      } else {
        await downloadAll(files);
      }
      return true;
    } catch (e) {
      if (!e || e.name !== 'AbortError') $('vSub').textContent = '저장하지 못했어요. 다시 눌러 주세요.';
      return false;
    }
  }
  $('vParts').addEventListener('click', async (e) => {
    const btn = e.target.closest('.part-save');
    if (!btn) return;
    const f = partFiles[+btn.dataset.i];
    if (f && await saveFiles([f], true)) { btn.textContent = '저장됨'; btn.classList.add('done'); }
  });
  /* 사진 전부를 ZIP 하나로 (사진은 이미 압축돼 있어 저장만 함) */
  const JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
  let jszipReady = null;
  function loadJSZip() {
    if (!jszipReady) {
      jszipReady = new Promise((res, rej) => {
        const sc = document.createElement('script');
        sc.src = JSZIP_URL; sc.onload = () => res(window.JSZip); sc.onerror = () => { jszipReady = null; rej(new Error('jszip')); };
        document.head.appendChild(sc);
      });
    }
    return jszipReady;
  }
  $('vZip').onclick = async () => {
    if (!vResults || !vResults.length) return;
    const btn = $('vZip');
    btn.disabled = true; const old = btn.textContent; btn.textContent = 'ZIP 만드는 중…';
    try {
      const JSZip = await loadJSZip();
      const zip = new JSZip();
      vResults.forEach((f) => zip.file(f.name, f));
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      const zname = vResults[0].name.replace(/_섯다_\d+\.jpg$/, '') + '_섯다.zip';
      const zf = new File([blob], zname, { type: 'application/zip' });
      if (await saveFiles([zf], true)) {
        $('vSub').textContent = isIOS
          ? `"파일에 저장"을 고르면 ZIP 파일(${fmtSize(zf.size)})로 저장돼요.`
          : `ZIP 파일 하나(${fmtSize(zf.size)})로 저장했어요. "다운로드" 폴더에서 확인하실 수 있어요.`;
      }
    } catch (e) {
      console.error(e);
      $('vSub').textContent = 'ZIP을 만들지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
    } finally { btn.disabled = false; btn.textContent = old; }
  };
  $('vSave').onclick = async () => {
    if (!vResults) return;
    if (await saveFiles(vResults) && !isIOS) {
      $('vSub').textContent = (vResults.length > 1 ? `${vResults.length}개 모두 ` : '') + '저장했어요. 갤러리의 "다운로드" 앨범에서 확인하실 수 있어요.';
      document.querySelectorAll('.part-save').forEach((x) => { x.textContent = '저장됨'; x.classList.add('done'); });
    }
  };
  $('vShare').onclick = async () => {
    if (!vResults) return;
    try {
      if (!canShareFiles(vResults)) { $('vSub').textContent = '이 기기에서는 바로 보낼 수 없어요. "저장하기"를 눌러 주세요.'; return; }
      await navigator.share({ files: vResults });
    } catch (e) { if (!e || e.name !== 'AbortError') $('vSub').textContent = '보내지 못했어요. 다시 눌러 주세요.'; }
  };

  /* files shared from other apps (Android share sheet → sw.js) */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  (async () => {
    const q = new URLSearchParams(location.search).get('shared');
    if (!q) return;
    history.replaceState(null, '', location.pathname);
    try {
      const cache = await caches.open('shared-file-v1');
      const key = new URL('./__shared__', location.href).href;
      const res = await cache.match(key);
      if (!res) return;
      const name = decodeURIComponent(res.headers.get('X-File-Name') || '동영상.mp4');
      const blob = await res.blob();
      await cache.delete(key);
      openVideo(new File([blob], name, { type: blob.type }));
    } catch {}
  })();

  /* drag & drop on desktop */
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) openVideo(f);
  });
})();
</script>
</body>
</html>
